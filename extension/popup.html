<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Manga Reader TTS</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <!-- Design: "Speed Line, marigold". data-pt is set to light or dark from the system theme. -->
  <body class="mr d3 v3a pop loading" data-pt="light">
    <header class="hd">
      <span class="ico">
        <svg viewBox="0.69 7.00 24.88 24.88" role="img" aria-label="Manga Reader icon">
          <!-- A white manga speech bubble (black outline) with a plain marigold copy behind it, offset up and right. -->
          <ellipse cx="15.5" cy="15.5" rx="10" ry="7.2" fill="#F2A900" />
          <polygon points="9.5,20.5 5.5,27.5 15.5,22" fill="#F2A900" />
          <ellipse cx="12.5" cy="18.5" rx="10" ry="7.2" fill="#1A1714" stroke="#1A1714" stroke-width="4" />
          <polygon points="6.5,23.5 2.5,30.5 12.5,25" fill="#1A1714" stroke="#1A1714" stroke-width="2" stroke-linejoin="round" />
          <ellipse cx="12.5" cy="18.5" rx="10" ry="7.2" fill="#FFFFFF" />
          <polygon points="7.3,23 4.6,28 11.8,24.2" fill="#FFFFFF" />
          <polygon points="9.8,14.2 9.8,22.8 17,18.5" fill="#F2A900" stroke="#1A1714" stroke-width="1.4" stroke-linejoin="round" />
        </svg>
      </span>
      <div class="ttl">
        <b>Manga Reader</b>
        <small id="version"></small>
      </div>
      <span id="state-tag" class="tag">Off</span>
      <button id="guide" class="help" type="button" title="Setup guide" aria-label="Open the setup guide">?</button>
    </header>

    <div class="main">
      <button id="toggle" class="go start" type="button" disabled>
        <span class="in">
          <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.2v11.6L13.5 8z" /></svg>
          <svg class="icon-stop" viewBox="0 0 16 16" aria-hidden="true" hidden>
            <rect x="3" y="3" width="10" height="10" rx="1.5" />
          </svg>
          <span id="toggle-label">Start reading</span>
        </span>
      </button>
      <p id="hint" class="hint" role="status"></p>
    </div>

    <ul class="stat" aria-label="Status">
      <li id="stat-ocr" tabindex="0" data-tip="Checking…"><i class="dot"></i><span>Text reader</span></li>
      <li id="stat-detector" tabindex="0" data-tip="Checking…"><i class="dot"></i><span>Bubbles</span></li>
      <li id="stat-voice" tabindex="0" data-tip="Checking…"><i class="dot"></i><span>Voice</span></li>
    </ul>

    <p id="note" class="note" hidden><span id="note-text"></span></p>

    <div class="set">
      <div class="row">
        <label for="voice">Voice</label>
        <div class="ctl">
          <span class="sel">
            <select id="voice">
              <optgroup id="kokoro-voices" label="Kokoro (local AI)"></optgroup>
              <optgroup id="browser-voices" label="Browser voices">
              </optgroup>
            </select>
          </span>
          <button id="test" class="play" type="button" aria-label="Play sample" title="Play sample"></button>
        </div>
      </div>

      <div class="row">
        <label for="rate">Speed</label>
        <div class="ctl">
          <input id="rate" type="range" min="0.5" max="4" step="0.1" />
          <output id="rate-value" for="rate"></output>
        </div>
      </div>

      <div class="row pitch" id="pitch-row" hidden>
        <label for="pitch">Pitch</label>
        <div class="ctl">
          <!-- 2 is the maximum pitch chrome.tts supports. -->
          <input id="pitch" type="range" min="0" max="2" step="0.1" />
          <output id="pitch-value" for="pitch"></output>
        </div>
      </div>

      <div class="row">
        <label for="ocr-model">Text model</label>
        <div class="ctl"><span class="sel"><select id="ocr-model"></select></span></div>
      </div>

      <div class="row sw">
        <label for="english-only">English only</label>
        <input id="english-only" class="tog" type="checkbox" />
      </div>

      <div class="row sw">
        <label for="reread">Re-read when scrolling back</label>
        <input id="reread" class="tog" type="checkbox" />
      </div>

      <div class="row sw dbg">
        <label for="show-boxes">Show bubble frames</label>
        <input id="show-boxes" class="tog" type="checkbox" />
      </div>
    </div>
  </body>
</html>
